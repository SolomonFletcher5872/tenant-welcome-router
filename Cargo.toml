[package]
name = "tenant-welcome-router"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "0.7"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

